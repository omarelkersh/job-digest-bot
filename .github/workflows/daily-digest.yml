name: Daily Job Digest

on:
  schedule:
    # 05:00 UTC = 07:00 Europe/Berlin (CEST, summer) / 06:00 (CET, winter).
    # GitHub Actions cron only understands UTC, so this drifts by an hour
    # across the DST change instead of exactly matching "07:00 Berlin"
    # year-round — still comfortably "early morning" either way.
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run digest
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: python -m job_digest.main

      - name: Persist seen-jobs store and portal feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_jobs.json docs/jobs.json
          git diff --cached --quiet || git commit -m "chore: update seen jobs store + portal feed [skip ci]"
          # Pull --rebase first in case the portal backend committed a
          # docs/status.json update in the meantime (separate file, but
          # avoids a rare non-fast-forward push failure).
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
